name: Aktualizuj czytania

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"

permissions:
  contents: write

jobs:
  aktualizacja:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Biblioteki
        run: pip install requests beautifulsoup4

      - name: Aktualizuj czytania
        run: python update_readings.py

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readings.json
          git diff --cached --quiet || git commit -m "Aktualizacja czytań"
          git push
